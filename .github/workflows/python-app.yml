name: Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          choco install ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Package Application with Nuitka
        run: |
          python -m nuitka --standalone `
            --output-dir=dist `
            --output-filename=console.exe `
            --include-data-dir=assets=assets `
            --include-package=protocol `
            --include-module=uuid `
            --include-module=qfluentwidgets `
            --include-package=pkg `
            --include-package=components `
            --include-module=index `
            --include-module=loader `
            --include-module=monitor `
            --include-module=controller `
            --include-module=debug `
            --include-module=about `
            --include-module=setting `
            --include-module=guide `
            --enable-plugin=pyqt5 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/images/logo.ico `
            --assume-yes-for-downloads `
            main.py

      - name: Prepare distribution
        run: |
          Move-Item -Path "dist\main.dist" -Destination "dist\console"

      - name: Create NSIS installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-windows
          path: AndlessConsole-Setup.exe

  build-macos:
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and create-dmg
        run: |
          brew install ffmpeg create-dmg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard imageio

      - name: Package Application with Nuitka
        run: |
          python -m nuitka --standalone \
            --output-dir=dist \
            --include-data-dir=assets=assets \
            --include-package=protocol \
            --include-module=uuid \
            --include-module=qfluentwidgets \
            --include-package=pkg \
            --include-package=components \
            --include-module=index \
            --include-module=loader \
            --include-module=monitor \
            --include-module=controller \
            --include-module=debug \
            --include-module=about \
            --include-module=setting \
            --include-module=guide \
            --enable-plugin=pyqt5 \
            --macos-create-app-bundle \
            --macos-app-name="Andless Console" \
            --macos-app-icon=assets/images/logo.jpg \
            --assume-yes-for-downloads \
            main.py

      - name: Rename app bundle
        run: |
          mv "dist/main.app" "dist/Andless Console.app"

      - name: Create DMG installer
        run: |
          create-dmg \
            --volname "Andless Console" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Andless Console.app" 150 190 \
            --app-drop-link 450 190 \
            "AndlessConsole.dmg" \
            "dist/Andless Console.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-macos
          path: AndlessConsole.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxcb-xinerama0 libxcb-cursor0 patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Package Application with Nuitka
        run: |
          python -m nuitka --standalone \
            --output-dir=dist \
            --output-filename=console \
            --include-data-dir=assets=assets \
            --include-package=protocol \
            --include-module=uuid \
            --include-module=qfluentwidgets \
            --include-package=pkg \
            --include-package=components \
            --include-module=index \
            --include-module=loader \
            --include-module=monitor \
            --include-module=controller \
            --include-module=debug \
            --include-module=about \
            --include-module=setting \
            --include-module=guide \
            --enable-plugin=pyqt5 \
            --assume-yes-for-downloads \
            main.py

      - name: Prepare distribution
        run: |
          mv dist/main.dist dist/console

      - name: Build .deb package
        run: |
          PKG_ROOT=deb_pkg
          mkdir -p $PKG_ROOT/DEBIAN
          mkdir -p $PKG_ROOT/opt/andless-console
          mkdir -p $PKG_ROOT/usr/share/applications
          mkdir -p $PKG_ROOT/usr/share/icons/hicolor/256x256/apps

          cp -r dist/console/* $PKG_ROOT/opt/andless-console/
          chmod +x $PKG_ROOT/opt/andless-console/console

          # 桌面快捷方式
          cat > $PKG_ROOT/usr/share/applications/andless-console.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Andless Console
          Comment=Remote Control System
          Exec=/opt/andless-console/console
          Icon=andless-console
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP
          sed -i 's/^          //' $PKG_ROOT/usr/share/applications/andless-console.desktop

          # 图标
          if [ -f assets/images/logo.ico ]; then
            cp assets/images/logo.ico $PKG_ROOT/usr/share/icons/hicolor/256x256/apps/andless-console.ico
          fi

          # control 文件：版本号必须以数字开头，非 tag 时使用 0.0.0-dev
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            PKG_VERSION="${GITHUB_REF_NAME#v}"
          else
            PKG_VERSION="0.0.0-dev"
          fi

          cat > $PKG_ROOT/DEBIAN/control << CTRL
          Package: andless-console
          Version: ${PKG_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg
          Maintainer: Andless Team
          Description: Andless Console - Remote Control System
          CTRL
          sed -i 's/^          //' $PKG_ROOT/DEBIAN/control

          dpkg-deb --build $PKG_ROOT andless-console.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-linux
          path: andless-console.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/console-windows/AndlessConsole-Setup.exe
            artifacts/console-macos/AndlessConsole.dmg
            artifacts/console-linux/andless-console.deb

  upload-oss:
    if: github.event_name == 'push'
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install ossutil v2
        run: |
          curl -fsSL -o ossutil.zip "https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip"
          unzip ossutil.zip
          sudo mv ossutil-2.2.1-linux-amd64/ossutil /usr/local/bin/
          ossutil version

      - name: Determine upload path
        id: oss-path
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "dir=releases/${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=dev/latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          OSS_DIR="${{ steps.oss-path.outputs.dir }}"
          BUCKET="${{ secrets.OSS_BUCKET }}"
          ENDPOINT="${{ secrets.OSS_ENDPOINT }}"
          REGION=$(echo "$ENDPOINT" | sed 's/^oss-//;s/\.aliyuncs\.com$//')
          ossutil cp artifacts/console-windows/AndlessConsole-Setup.exe "oss://${BUCKET}/${OSS_DIR}/AndlessConsole-Setup.exe" --endpoint="${ENDPOINT}" --region="${REGION}" --force
          ossutil cp artifacts/console-macos/AndlessConsole.dmg "oss://${BUCKET}/${OSS_DIR}/AndlessConsole.dmg" --endpoint="${ENDPOINT}" --region="${REGION}" --force
          ossutil cp artifacts/console-linux/andless-console.deb "oss://${BUCKET}/${OSS_DIR}/andless-console.deb" --endpoint="${ENDPOINT}" --region="${REGION}" --force
